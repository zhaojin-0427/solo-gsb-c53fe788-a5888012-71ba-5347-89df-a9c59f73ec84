services:
  workbench:
    build: .
    image: compensation-workflow-bench:latest
    container_name: compensation-workflow-bench
    ports:
      - "8000:8000"
    volumes:
      - workbench-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  workbench-data:
